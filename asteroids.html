<div id="asteroids-overlay" aria-hidden="true">
  <style>
    #asteroids-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(4, 6, 12, 0.96);
      color: #cfd8e3;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    #asteroids-overlay.open { display: flex; align-items: center; justify-content: center; }
    #asteroids-box { position: relative; width: min(92vw, 1000px); }
    #asteroids-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #05070d;
      border: 1px solid #2a3550;
      border-radius: 8px;
      outline: none;
    }
    #asteroids-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #2a3550;
      background: #0d1220;
      color: #cfd8e3;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }
    #asteroids-close:hover { background: #8b2f2f; border-color: #8b2f2f; color: #fff; }
    #asteroids-help {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #8b99b0;
      letter-spacing: 0.03em;
    }
    #asteroids-help b { color: #cfd8e3; font-weight: 500; }
  </style>
  <div id="asteroids-box">
    <button id="asteroids-close" title="Close (Esc)" aria-label="Close game">&times;</button>
    <canvas id="asteroids-canvas" width="960" height="600" tabindex="0"></canvas>
    <div id="asteroids-help">
      <b>&larr; &rarr;</b> rotate &nbsp;·&nbsp; <b>&uarr;</b> thrust &nbsp;·&nbsp; <b>space</b> fire &nbsp;·&nbsp; <b>esc</b> exit
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---- Open / close plumbing ------------------------------------------- */
  var overlay = document.getElementById("asteroids-overlay");
  var canvas = document.getElementById("asteroids-canvas");
  var ctx = canvas.getContext("2d");
  var rafId = null;
  var keys = {};

  function openGame() {
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    canvas.focus();
    resetGame();
    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  function closeGame() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  document.getElementById("asteroids-close").addEventListener("click", closeGame);

  window.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
      e.preventDefault();           /* override browser "save page" */
      openGame();
      return;
    }
    if (!overlay.classList.contains("open")) return;
    if (e.key === "Escape") { e.preventDefault(); closeGame(); return; }
    if (e.key === " ") e.preventDefault();
    keys[e.key] = true;
  });

  window.addEventListener("keyup", function (e) { keys[e.key] = false; });

  /* ---- Game state -------------------------------------------------------- */
  var W = canvas.width, H = canvas.height;
  var ship, bullets, rocks, particles, score, lives, invuln, level, gameOver;

  function resetGame() {
    ship = { x: W / 2, y: H / 2, angle: -Math.PI / 2, vx: 0, vy: 0, r: 10 };
    bullets = []; particles = []; score = 0; level = 1; gameOver = false;
    lives = 3; invuln = 120;
    spawnRocks(4);
  }

  function spawnRocks(n) {
    rocks = [];
    for (var i = 0; i < n; i++) {
      var edge = Math.floor(Math.random() * 4), x, y;
      if (edge === 0) { x = Math.random() * W; y = -30; }
      else if (edge === 1) { x = W + 30; y = Math.random() * H; }
      else if (edge === 2) { x = Math.random() * W; y = H + 30; }
      else { x = -30; y = Math.random() * H; }
      var a = Math.random() * Math.PI * 2, s = 0.6 + Math.random() * 0.7 + level * 0.08;
      rocks.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 34, rot: 0, vr: (Math.random() - 0.5) * 0.04 });
    }
  }

  function explode(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = Math.random() * 3;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40 + Math.random() * 30 });
    }
  }

  function stepShip() {
    if (keys["ArrowLeft"]) ship.angle -= 0.06;
    if (keys["ArrowRight"]) ship.angle += 0.06;
    if (keys["ArrowUp"]) {
      ship.vx += Math.cos(ship.angle) * 0.08;
      ship.vy += Math.sin(ship.angle) * 0.08;
      particles.push({
        x: ship.x - Math.cos(ship.angle) * 12, y: ship.y - Math.sin(ship.angle) * 12,
        vx: -Math.cos(ship.angle) * 2 + (Math.random() - 0.5), vy: -Math.sin(ship.angle) * 2 + (Math.random() - 0.5),
        life: 15
      });
    }
    ship.vx *= 0.99; ship.vy *= 0.99;
    ship.x = (ship.x + ship.vx + W) % W;
    ship.y = (ship.y + ship.vy + H) % H;
    if (invuln > 0) invuln--;
  }

  var lastShot = 0;
  function stepBullets(t) {
    if (keys[" "] && t - lastShot > 220) {
      lastShot = t;
      bullets.push({ x: ship.x + Math.cos(ship.angle) * 14, y: ship.y + Math.sin(ship.angle) * 14,
                     vx: ship.vx + Math.cos(ship.angle) * 6, vy: ship.vy + Math.sin(ship.angle) * 6, life: 70 });
    }
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x = (b.x + b.vx + W) % W; b.y = (b.y + b.vy + H) % H;
      if (--b.life <= 0) bullets.splice(i, 1);
    }
  }

  function dist2(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }

  function stepRocks() {
    for (var i = rocks.length - 1; i >= 0; i--) {
      var r = rocks[i];
      r.x = (r.x + r.vx + W) % W; r.y = (r.y + r.vy + H) % H; r.rot += r.vr;

      if (!gameOver && invuln === 0 && dist2(r, ship) < (r.r + ship.r) * (r.r + ship.r)) {
        explode(ship.x, ship.y, 40);
        lives--;
        if (lives <= 0) { gameOver = true; }
        else { ship.x = W / 2; ship.y = H / 2; ship.vx = ship.vy = 0; invuln = 120; }
      }

      for (var j = bullets.length - 1; j >= 0; j--) {
        if (dist2(r, bullets[j]) < r.r * r.r) {
          bullets.splice(j, 1);
          score += r.r > 25 ? 20 : (r.r > 14 ? 50 : 100);
          explode(r.x, r.y, 18);
          if (r.r > 14) {
            for (var k = 0; k < 2; k++) {
              var a = Math.random() * Math.PI * 2, s = 1 + Math.random();
              rocks.push({ x: r.x, y: r.y, vx: Math.cos(a) * s + r.vx, vy: Math.sin(a) * s + r.vy,
                           r: r.r / 2, rot: 0, vr: (Math.random() - 0.5) * 0.08 });
            }
          }
          rocks.splice(i, 1);
          break;
        }
      }
    }
    if (!rocks.length && !gameOver) { level++; spawnRocks(3 + level); }
  }

  function stepParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (--p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#5be0a0";
    ctx.fillStyle = "#5be0a0";

    particles.forEach(function (p) {
      ctx.globalAlpha = Math.max(p.life / 40, 0);
      ctx.fillRect(p.x, p.y, 2, 2);
    });
    ctx.globalAlpha = 1;

    bullets.forEach(function (b) { ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3); });

    rocks.forEach(function (r) {
      ctx.save();
      ctx.translate(r.x, r.y); ctx.rotate(r.rot);
      ctx.beginPath();
      var n = 9;
      for (var i = 0; i <= n; i++) {
        var a = (i / n) * Math.PI * 2;
        var rad = r.r * (0.82 + 0.18 * Math.sin(a * 3 + r.rot * 5));
        var px = Math.cos(a) * rad, py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    });

    if (!gameOver) {
      ctx.save();
      ctx.translate(ship.x, ship.y); ctx.rotate(ship.angle);
      if (invuln > 0 && Math.floor(invuln / 6) % 2 === 0) ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(-10, -8); ctx.lineTo(-6, 0); ctx.lineTo(-10, 8);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }

    ctx.fillStyle = "#cfd8e3";
    ctx.font = "16px 'IBM Plex Mono', monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 14, 26);
    ctx.textAlign = "right";
    ctx.fillText("LIVES " + Math.max(lives, 0), W - 14, 26);
    if (gameOver) {
      ctx.textAlign = "center";
      ctx.font = "34px 'IBM Plex Mono', monospace";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
      ctx.font = "15px 'IBM Plex Mono', monospace";
      ctx.fillText("space to restart · esc to exit", W / 2, H / 2 + 22);
      if (keys[" "]) resetGame();
    }
  }

  function loop(t) {
    if (!overlay.classList.contains("open")) { rafId = null; return; }
    if (!gameOver) stepShip();
    stepBullets(t || 0);
    stepRocks();
    stepParticles();
    draw();
    rafId = requestAnimationFrame(loop);
  }
})();
</script>
